<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pluto Archive</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ===================================================== -->
    <!-- Background -->
    <!-- ===================================================== -->

    <div id="background">

        <div id="stars"></div>

        <div id="nebula"></div>

        <div id="vignette"></div>

    </div>



    <!-- ===================================================== -->
    <!-- Universe -->
    <!-- ===================================================== -->

    <main id="universe">



        <!-- ================================================= -->
        <!-- Camera -->
        <!-- ================================================= -->

        <div id="camera">



            <!-- ============================================= -->
            <!-- Core -->
            <!-- ============================================= -->

            <section id="core">

                <div class="core-ring core-ring-1"></div>
                <div class="core-ring core-ring-2"></div>
                <div class="core-ring core-ring-3"></div>

                <div id="core-center">

                    <h1>PLUTO</h1>

                    <p>ARCHIVE</p>

                </div>

            </section>



            <!-- ============================================= -->
            <!-- Orbit 1 -->
            <!-- ============================================= -->

            <section class="orbit"

                data-radius="170"
                data-speed="0.22"
                data-tilt="0">

                <div class="planet-wrapper"

                    data-name="setting"

                    data-link="pages/setting.html"

                    data-angle="0"

                    data-size="42"

                    data-spin-speed="0.8"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                    </button>

                    <div class="planet-label">

                        About

                    </div>

                </div>



                <div class="planet-wrapper"

                    data-name="Gallery"

                    data-link="pages/gallery.html"

                    data-angle="180"

                    data-size="50"

                    data-spin-speed="0.6"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                    </button>

                    <div class="planet-label">

                        Gallery

                    </div>

                </div>

            </section>



            <!-- ============================================= -->
            <!-- Orbit 2 -->
            <!-- ============================================= -->

            <section class="orbit"

                data-radius="260"

                data-speed="-0.2"

                data-tilt="18">

                <div class="planet-wrapper"

                    data-name="Commission"

                    data-link="pages/commission.html"

                    data-angle="30"

                    data-size="64"

                    data-spin-speed="-0.7"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                        <div class="planet-ring"></div>

                    </button>

                    <div class="planet-label">

                        Commission

                    </div>

                </div>



                <div class="planet-wrapper"

                    data-name="Blog"

                    data-link="pages/blog.html"

                    data-angle="150"

                    data-size="54"

                    data-spin-speed="1"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                    </button>

                    <div class="planet-label">

                        Blog

                    </div>

                </div>



                <div class="planet-wrapper"

                    data-name="Contact"

                    data-link="pages/contact.html"

                    data-angle="270"

                    data-size="58"

                    data-spin-speed="0.7"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                    </button>

                    <div class="planet-label">

                        Contact

                    </div>

                </div>

            </section>



            <!-- ============================================= -->
            <!-- Orbit 3 -->
            <!-- ============================================= -->

            <section class="orbit"

                data-radius="350"

                data-speed="0.1"

                data-tilt="0">

                <div class="planet-wrapper"

                    data-name="Links"

                    data-link="pages/links.html"

                    data-angle="80"

                    data-size="74"

                    data-spin-speed="0.35"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                        <div class="planet-ring"></div>

                    </button>

                    <div class="planet-label">

                        Links

                    </div>

                </div>



                <div class="planet-wrapper"

                    data-name="Project"

                    data-link="pages/project.html"

                    data-angle="220"

                    data-size="60"

                    data-spin-speed="0.6"

                    data-orbit-speed="1">

                    <button class="planet">

                        <div class="planet-highlight"></div>

                    </button>

                    <div class="planet-label">

                        Project

                    </div>

                </div>

            </section>



        </div>

    </main>



    <!-- ===================================================== -->
    <!-- Scripts -->
    <!-- ===================================================== -->

    <script src="js/other.js"></script>

    <script src="js/mouse.js"></script>

    <script src="js/camera.js"></script>

    <script src="js/planet.js"></script>

    <script src="js/orbit.js"></script>

    <script src="js/engine.js"></script>

    <script src="js/main.js"></script>

</body>

</html>
