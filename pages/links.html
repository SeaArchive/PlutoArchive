<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links</title>
<link rel="stylesheet" href="links.css">
</head>
<body>
<main class="link-page">
  <div class="arrival-particles" aria-hidden="true"></div>

  <div class="link-card-orbit" id="linkCardOrbit" aria-label="Links card orbit">
    <section class="link-cards" id="linkCards" aria-label="Links">
      <article class="link-card-position" data-index="0"><article class="link-card" data-link-id="link-01" tabindex="0" aria-label="Link card 1"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="1"><article class="link-card" data-link-id="link-02" tabindex="0" aria-label="Link card 2"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="2"><article class="link-card" data-link-id="link-03" tabindex="0" aria-label="Link card 3"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="3"><article class="link-card" data-link-id="link-04" tabindex="0" aria-label="Link card 4"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="4"><article class="link-card" data-link-id="link-05" tabindex="0" aria-label="Link card 5"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="5"><article class="link-card" data-link-id="link-06" tabindex="0" aria-label="Link card 6"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="6"><article class="link-card" data-link-id="link-07" tabindex="0" aria-label="Link card 7"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="7"><article class="link-card" data-link-id="link-08" tabindex="0" aria-label="Link card 8"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="8"><article class="link-card" data-link-id="link-09" tabindex="0" aria-label="Link card 9"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="9"><article class="link-card" data-link-id="link-10" tabindex="0" aria-label="Link card 10"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="10"><article class="link-card" data-link-id="link-11" tabindex="0" aria-label="Link card 11"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="11"><article class="link-card" data-link-id="link-12" tabindex="0" aria-label="Link card 12"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="12"><article class="link-card" data-link-id="link-13" tabindex="0" aria-label="Link card 13"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
      <article class="link-card-position" data-index="13"><article class="link-card" data-link-id="link-14" tabindex="0" aria-label="Link card 14"><div class="link-card-inner"><div class="link-card-face link-card-back"><img class="card-image" data-card-back alt=""></div><div class="link-card-face link-card-front"><img class="card-image" data-card-front alt=""></div></div></article></article>
    </section>
  </div>
</main>
<script>
(()=>{
  const field=document.querySelector('.arrival-particles');
  const count=150;
  for(let i=0;i<count;i++){
    const p=document.createElement('i');
    p.className='arrival-particle';
    const progress=i/(count-1);
    const x=108-(progress*145)+((Math.random()-.5)*8);
    const y=(Math.random()-.5)*300;
    p.style.setProperty('--start-x',`${x}vw`);
    p.style.setProperty('--start-y',`${y}px`);
    p.style.setProperty('--drift-x',`${35+Math.random()*110}px`);
    p.style.setProperty('--drift-y',`${(Math.random()-.5)*90}px`);
    p.style.setProperty('--delay',`${progress*.7+Math.random()*.18}s`);
    p.style.setProperty('--size',`${1+Math.random()*3}px`);
    p.style.setProperty('--duration',`${3.2+Math.random()*2}s`);
    field.appendChild(p);
  }

  const cards=[...document.querySelectorAll('.link-card-position')];
  const reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
  let angle=0;
  let speed=0.018;
  let lastTime=performance.now();
  let radius=0;

  const setImage=(img,path)=>{
    if(!path) return;
    img.src=path;
    img.addEventListener('error',()=>img.removeAttribute('src'),{once:true});
  };

  document.querySelectorAll('.link-card').forEach(card=>{
    setImage(card.querySelector('[data-card-front]'),card.dataset.frontImage||'');
    setImage(card.querySelector('[data-card-back]'),card.dataset.backImage||'');
    const enter=()=>card.classList.add('is-hovered');
    const leave=()=>card.classList.remove('is-hovered');
    card.addEventListener('mouseenter',enter);
    card.addEventListener('mouseleave',leave);
    card.addEventListener('focusin',enter);
    card.addEventListener('focusout',leave);
  });

  const resize=()=>{
    radius=Math.min(window.innerWidth,window.innerHeight)*0.612;
    if(window.innerWidth<=820) radius=Math.min(window.innerWidth,window.innerHeight)*0.646;
  };

  const render=()=>{
    const count=cards.length;
    cards.forEach((wrapper,index)=>{
      const a=angle+(index/count)*Math.PI*2;
      const x=Math.sin(a)*radius;
      const z=-Math.cos(a)*radius;
      const depth=(Math.cos(a)+1)*0.5;
      const zIndex=Math.round(depth*100);
      const radialDeg=(a*180/Math.PI)+180;
      const scale=0.88+(depth*0.16);
      wrapper.style.transform=`translate(-50%,-50%) translate3d(${x}px,0,${z}px) rotateY(${radialDeg}deg)`;
      wrapper.style.zIndex=zIndex;
      wrapper.querySelector('.link-card').style.setProperty('--depth-scale',scale.toFixed(3));
    });
  };

  const tick=(now)=>{
    const dt=Math.min((now-lastTime)/16.6667,3);
    lastTime=now;
    const hovered=document.querySelector('.link-card.is-hovered');
    const targetSpeed=reduceMotion.matches?0:(hovered?0:0.018);
    speed+=(targetSpeed-speed)*Math.min(1,0.035*dt);
    angle+=speed*dt;
    render();
    requestAnimationFrame(tick);
  };

  resize();
  window.addEventListener('resize',resize,{passive:true});
  render();
  requestAnimationFrame(tick);
  requestAnimationFrame(()=>document.getElementById('linkCards').classList.add('is-ready'));
})();
</script>
</body>
</html>
