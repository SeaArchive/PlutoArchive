<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hidden Archive | Pluto Archive</title>

  <script>
    if (sessionStorage.getItem('plutoArkHiddenUnlocked') !== '1') {
      window.location.replace('blog.html');
    }
  </script>

  <style>
    :root {
      --bg: #010105;
      --text: #f2efff;
      --muted: #817b92;
      --violet: #b299ff;
      --gold: #dbc990;
      --cyan: #8fc8ff;
      --line: rgba(178,153,255,.22);
      --cube-size: 44px;
      --cube-step: 54px;
      --card-w: 30px;
      --card-h: 44px;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 50%, rgba(178,153,255,.09), transparent 24%),
        radial-gradient(circle at 50% 50%, rgba(80,125,190,.05), transparent 44%),
        #010105;
    }

    .hidden-world {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 650px;
      perspective-origin: 50% 46%;
    }

    .hidden-world::before,
    .hidden-world::after {
      content: "";
      position: absolute;
      inset: -25%;
      pointer-events: none;
    }

    .hidden-world::before {
      background-image:
        radial-gradient(circle, rgba(255,255,255,.48) 0 1px, transparent 1.3px),
        radial-gradient(circle, rgba(150,190,255,.34) 0 1px, transparent 1.2px),
        radial-gradient(circle, rgba(210,195,255,.26) 0 1px, transparent 1.2px);
      background-size: 139px 139px, 211px 211px, 83px 83px;
      background-position: 18px 31px, 71px 104px, 42px 19px;
      opacity: .22;
      animation: starDrift 70s linear infinite;
    }

    .hidden-world::after {
      background:
        radial-gradient(circle at 50% 50%, transparent 0 24%, rgba(0,0,0,.22) 58%, rgba(0,0,0,.72) 100%);
    }

    .scene {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
      transform: translate3d(-50%, -50%, -24px);
    }

    .assembly {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .cube-node {
      position: absolute;
      left: calc(var(--cube-size) / -2);
      top: calc(var(--cube-size) / -2);
      width: var(--cube-size);
      height: var(--cube-size);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .cube {
      position: absolute;
      inset: 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    .face {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(194,178,255,.28);
      background:
        linear-gradient(135deg, rgba(190,220,255,.08), rgba(178,153,255,.025)),
        rgba(6,8,18,.52);
      box-shadow:
        inset 0 0 16px rgba(170,200,255,.035),
        0 0 12px rgba(178,153,255,.025);
      backface-visibility: hidden;
    }

    .face::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1px solid rgba(150,190,235,.08);
    }

    .front  { transform: translateZ(calc(var(--cube-size) / 2)); }
    .back   { transform: rotateY(180deg) translateZ(calc(var(--cube-size) / 2)); }
    .right  { transform: rotateY(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .left   { transform: rotateY(-90deg) translateZ(calc(var(--cube-size) / 2)); }
    .top    { transform: rotateX(90deg) translateZ(calc(var(--cube-size) / 2)); }
    .bottom { transform: rotateX(-90deg) translateZ(calc(var(--cube-size) / 2)); }

    .cube-node:nth-child(3n + 1) .face {
      border-color: rgba(147,198,255,.28);
    }

    .cube-node:nth-child(4n + 2) .face {
      border-color: rgba(219,201,144,.25);
    }

    .core-cube-node {
      z-index: 4;
    }

    .core-cube-node::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: calc(var(--cube-size) * 2.2);
      height: calc(var(--cube-size) * 2.2);
      border-radius: 50%;
      transform: translate(-50%, -50%) translateZ(-2px);
      background: radial-gradient(
        circle,
        rgba(118,211,255,.20) 0%,
        rgba(92,190,255,.10) 38%,
        rgba(73,214,255,.035) 62%,
        transparent 74%
      );
      filter: blur(10px);
      pointer-events: none;
    }

    .core-cube-node .face {
      border-color: rgba(159,226,255,.72);
      background:
        linear-gradient(145deg, rgba(170,230,255,.19), rgba(92,190,255,.055)),
        rgba(7,14,24,.66);
      box-shadow:
        inset 0 0 18px rgba(145,222,255,.11),
        0 0 10px rgba(92,190,255,.12),
        0 0 22px rgba(73,214,255,.08);
    }

    .core-cube-node .face::after {
      border-color: rgba(180,235,255,.20);
    }

    .orbit-field {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .orbit-card {
      --card-width: var(--card-w);
      --depth-alpha: 1;
      position: absolute;
      left: 0;
      top: 0;
      width: var(--card-width);
      height: var(--card-h);
      margin-left: calc(var(--card-width) / -2);
      margin-top: calc(var(--card-h) / -2);
      transform-style: preserve-3d;
      transform-origin: 50% 50%;
      will-change: transform;
    }

    .orbit-card-side {
      position: absolute;
      inset: 0;
      border-radius: 1px;
      opacity: var(--depth-alpha);
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      transform-style: preserve-3d;
    }

    /* +Z always points toward the large cube, so this is the inward face. */
    .orbit-card-side.inward {
      transform: translateZ(.45px);
      border: 1px solid rgba(155,175,205,.34);
      background:
        linear-gradient(145deg, rgba(18,22,30,.96), rgba(0,0,0,.995)),
        #000;
      box-shadow:
        inset 0 0 10px rgba(130,175,220,.04),
        0 0 7px rgba(0,0,0,.26);
    }

    /* The reverse face looks away from the cube and remains white. */
    .orbit-card-side.outward {
      transform: translateZ(-.45px) rotateY(180deg);
      border: 1px solid rgba(255,255,255,.92);
      background:
        linear-gradient(145deg, rgba(255,255,255,.995), rgba(226,232,242,.97));
      box-shadow:
        0 0 8px rgba(225,235,255,.12),
        inset 0 0 0 1px rgba(255,255,255,.30);
    }

    .orbit-card-side::before,
    .orbit-card-side::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      height: 1px;
    }

    .orbit-card-side::before {
      top: 9px;
      width: 42%;
    }

    .orbit-card-side::after {
      bottom: 8px;
      width: 58%;
    }

    .orbit-card-side.inward::before,
    .orbit-card-side.inward::after {
      background: rgba(150,180,215,.10);
    }

    .orbit-card-side.outward::before,
    .orbit-card-side.outward::after {
      background: rgba(72,82,103,.15);
    }

    .spacer-card {
      height: calc(var(--card-h) * .58);
      margin-top: calc(var(--card-h) * -.29);
    }

    .spacer-face {
      position: absolute;
      inset: 0;
      opacity: var(--depth-alpha);
      border: 1px solid rgba(205,226,255,.18);
      border-radius: 1px;
      background:
        linear-gradient(145deg, rgba(210,230,255,.055), rgba(130,165,210,.018));
      box-shadow:
        inset 0 0 9px rgba(190,220,255,.025),
        0 0 7px rgba(150,190,235,.03);
      backface-visibility: visible;
      -webkit-backface-visibility: visible;
    }

    .spacer-face::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38%;
      height: 1px;
      transform: translate(-50%, -50%);
      background: rgba(215,232,255,.12);
    }

    .core-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(178,153,255,.10), rgba(100,140,210,.035) 38%, transparent 70%);
      filter: blur(18px);
      pointer-events: none;
    }

    .ui {
      position: fixed;
      z-index: 10;
      inset: 0;
      pointer-events: none;
    }

    .label {
      position: absolute;
      left: 22px;
      top: 20px;
    }

    .label span {
      display: block;
      color: var(--violet);
      font-size: 9px;
      letter-spacing: .22em;
    }

    .label strong {
      display: block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: .16em;
    }

    .label small {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .08em;
    }

    .return-link {
      position: absolute;
      right: 20px;
      top: 18px;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: rgba(3,4,10,.62);
      color: var(--text);
      text-decoration: none;
      font-size: 9px;
      letter-spacing: .14em;
      pointer-events: auto;
    }

    .return-link:hover,
    .return-link:focus-visible {
      outline: none;
      border-color: rgba(178,153,255,.58);
      color: #fff;
    }

    .status {
      position: absolute;
      left: 22px;
      bottom: 20px;
      color: rgba(129,123,146,.72);
      font-size: 8px;
      letter-spacing: .12em;
    }

    @keyframes starDrift {
      to { transform: translate3d(80px, 42px, 0); }
    }

    @media (max-width: 640px) {
      .hidden-world {
        perspective: 560px;
        perspective-origin: 50% 47%;
      }

      :root {
        --cube-size: 35px;
        --cube-step: 43px;
        --card-w: 23px;
        --card-h: 34px;
      }

      .label {
        left: 14px;
        top: 14px;
      }

      .label small {
        max-width: 190px;
        line-height: 1.6;
      }

      .return-link {
        right: 12px;
        top: 12px;
        min-height: 38px;
        padding: 0 10px;
        font-size: 8px;
      }

      .status {
        left: 14px;
        bottom: 14px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .hidden-world::before {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="hidden-world">
    <div class="core-glow" aria-hidden="true"></div>

    <div class="scene" aria-label="3x3x3 animated cube structure with three orbital card rings">
      <div id="orbitField" class="orbit-field" aria-hidden="true"></div>
      <div id="assembly" class="assembly"></div>
    </div>

    <div class="ui">
      <div class="label">
        <span>UNNUMBERED RECORD / EXPERIMENT 01</span>
        <strong>27-BODY CUBE</strong>
        <small>3 × 3 × 3 / LOCAL DISPLACEMENT FIELD</small>
      </div>

      <a class="return-link" href="blog.html">RETURN TO THE ARK</a>
      <div class="status">27 NODES / 3 CARD RINGS / TRANSLUCENT INTERSTITIAL PANELS</div>
    </div>
  </main>

  <script>
    const assembly = document.getElementById('assembly');
    const orbitField = document.getElementById('orbitField');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const nodes = [];
    const GRID = 3;
    const HALF = 1;
    const MOVE_RANGE = 9;
    const ROTATE_RANGE = 10;

    function seeded(index, channel) {
      const value = Math.sin(index * 91.17 + channel * 43.71) * 43758.5453;
      return value - Math.floor(value);
    }

    function makeCube(index, gx, gy, gz) {
      const node = document.createElement('div');
      node.className = 'cube-node';
      if (gx === 0 && gy === 0 && gz === 0) {
        node.classList.add('core-cube-node');
      }

      const cube = document.createElement('div');
      cube.className = 'cube';

      ['front','back','right','left','top','bottom'].forEach(name => {
        const face = document.createElement('div');
        face.className = `face ${name}`;
        cube.appendChild(face);
      });

      node.appendChild(cube);
      assembly.appendChild(node);

      nodes.push({
        node,
        cube,
        baseX: gx,
        baseY: gy,
        baseZ: gz,
        phaseX: seeded(index, 1) * Math.PI * 2,
        phaseY: seeded(index, 2) * Math.PI * 2,
        phaseZ: seeded(index, 3) * Math.PI * 2,
        speedX: .00045 + seeded(index, 4) * .00055,
        speedY: .00042 + seeded(index, 5) * .00058,
        speedZ: .00038 + seeded(index, 6) * .00062,
        ampX: 3 + seeded(index, 7) * MOVE_RANGE,
        ampY: 3 + seeded(index, 8) * MOVE_RANGE,
        ampZ: 3 + seeded(index, 9) * MOVE_RANGE,
        rotX: 4 + seeded(index, 10) * ROTATE_RANGE,
        rotY: 4 + seeded(index, 11) * ROTATE_RANGE,
        rotZ: 3 + seeded(index, 12) * ROTATE_RANGE
      });
    }

    let index = 0;
    for (let z = -HALF; z <= HALF; z += 1) {
      for (let y = -HALF; y <= HALF; y += 1) {
        for (let x = -HALF; x <= HALF; x += 1) {
          makeCube(index, x, y, z);
          index += 1;
        }
      }
    }

    function getStep() {
      return parseFloat(
        getComputedStyle(document.documentElement)
          .getPropertyValue('--cube-step')
      ) || 54;
    }

    const ringCards = [];
    const RINGS = [
      {
        count: 30,
        radius: 150,
        phase: 0.10,
        spinSpeed: .00048,
        precessX: .00011,
        precessY: .00017,
        precessZ: .00007,
        tiltX: 18,
        tiltY: 0,
        tiltZ: 0
      },
      {
        count: 36,
        radius: 184,
        phase: 1.35,
        spinSpeed: -.00039,
        precessX: -.00008,
        precessY: .00013,
        precessZ: .00010,
        tiltX: 68,
        tiltY: 16,
        tiltZ: 10
      },
      {
        count: 42,
        radius: 218,
        phase: 2.20,
        spinSpeed: .00031,
        precessX: .00009,
        precessY: -.00010,
        precessZ: .00013,
        tiltX: 35,
        tiltY: 72,
        tiltZ: -18
      }
    ];

    function clamp(value, min, max) {
      return Math.max(min, Math.min(max, value));
    }

    function deg(value) {
      return value * Math.PI / 180;
    }

    function rotateVector(vector, rx, ry, rz) {
      let { x, y, z } = vector;

      let cos = Math.cos(rx);
      let sin = Math.sin(rx);
      [y, z] = [y * cos - z * sin, y * sin + z * cos];

      cos = Math.cos(ry);
      sin = Math.sin(ry);
      [x, z] = [x * cos + z * sin, -x * sin + z * cos];

      cos = Math.cos(rz);
      sin = Math.sin(rz);
      [x, y] = [x * cos - y * sin, x * sin + y * cos];

      return { x, y, z };
    }

    function normalizeVector(vector) {
      const length = Math.hypot(vector.x, vector.y, vector.z) || 1;
      return {
        x: vector.x / length,
        y: vector.y / length,
        z: vector.z / length
      };
    }

    function crossVector(a, b) {
      return {
        x: a.y * b.z - a.z * b.y,
        y: a.z * b.x - a.x * b.z,
        z: a.x * b.y - a.y * b.x
      };
    }

    function createCardRing(ring, ringIndex) {
      const angleStep = Math.PI * 2 / ring.count;

      for (let i = 0; i < ring.count; i += 1) {
        const baseAngle = angleStep * i + ring.phase;

        const card = document.createElement('div');
        card.className = `orbit-card ring-${ringIndex + 1}`;

        const inward = document.createElement('div');
        inward.className = 'orbit-card-side inward';

        const outward = document.createElement('div');
        outward.className = 'orbit-card-side outward';

        card.appendChild(inward);
        card.appendChild(outward);
        orbitField.appendChild(card);

        ringCards.push({
          element: card,
          ring,
          ringIndex,
          baseAngle,
          isSpacer: false
        });

        // A smaller translucent card floats halfway between each pair.
        const spacer = document.createElement('div');
        spacer.className = `orbit-card spacer-card ring-${ringIndex + 1}`;

        const spacerFace = document.createElement('div');
        spacerFace.className = 'spacer-face';
        spacer.appendChild(spacerFace);
        orbitField.appendChild(spacer);

        ringCards.push({
          element: spacer,
          ring,
          ringIndex,
          baseAngle: baseAngle + angleStep * .5,
          isSpacer: true
        });
      }
    }

    RINGS.forEach(createCardRing);

    function updateCardRings(time) {
      const mobileScale = window.innerWidth <= 640 ? .78 : 1;

      ringCards.forEach(item => {
        const ring = item.ring;
        const freeze = reducedMotion ? 0 : 1;

        const orbitalAngle =
          item.baseAngle + time * ring.spinSpeed * freeze;

        const scaledRadius = ring.radius * mobileScale;

        // Start with a circular ring in the local X/Y plane.
        let position = {
          x: Math.cos(orbitalAngle) * scaledRadius,
          y: Math.sin(orbitalAngle) * scaledRadius,
          z: 0
        };

        // The ring axis itself slowly precesses around the cube center.
        const rx = deg(ring.tiltX) + time * ring.precessX * freeze;
        const ry = deg(ring.tiltY) + time * ring.precessY * freeze;
        const rz = deg(ring.tiltZ) + time * ring.precessZ * freeze;

        position = rotateVector(position, rx, ry, rz);

        // Local +Z of every card points inward toward the large cube.
        const inward = normalizeVector({
          x: -position.x,
          y: -position.y,
          z: -position.z
        });

        // The card's vertical center axis is always parallel to the ring axis,
        // including when that axis is diagonal in 3D space.
        let up = normalizeVector(
          rotateVector({ x: 0, y: 0, z: 1 }, rx, ry, rz)
        );

        // Build an orthonormal card basis:
        // X = tangent around the ring, Y = ring axis, Z = inward normal.
        const right = normalizeVector(crossVector(up, inward));
        up = normalizeVector(crossVector(inward, right));

        // Keep the main cards separated. A smaller translucent card occupies
        // part of each gap without fully closing it.
        const connectedWidth =
          2 * scaledRadius * Math.tan(Math.PI / ring.count) + .7;
        const displayWidth = item.isSpacer
          ? connectedWidth * .18
          : connectedWidth * .68;

        item.element.style.setProperty(
          '--card-width',
          `${displayWidth}px`
        );

        item.element.style.transform =
          `matrix3d(` +
          `${right.x},${right.y},${right.z},0,` +
          `${up.x},${up.y},${up.z},0,` +
          `${inward.x},${inward.y},${inward.z},0,` +
          `${position.x},${position.y},${position.z},1)`;

        // Near cards stay bright while far cards recede slightly into the scene.
        const depth = clamp(
          (position.z / scaledRadius + 1) * .5,
          0,
          1
        );
        const depthAlpha = item.isSpacer
          ? 0.16 + depth * 0.20
          : 0.58 + depth * 0.42;

        item.element.style.setProperty(
          '--depth-alpha',
          depthAlpha.toFixed(3)
        );
      });
    }

    let pointerX = 0;
    let pointerY = 0;

    window.addEventListener('pointermove', event => {
      pointerX = (event.clientX / window.innerWidth - .5) * 2;
      pointerY = (event.clientY / window.innerHeight - .5) * 2;
    }, { passive: true });

    function render(time) {
      const step = getStep();

      const globalRotX = -18 + Math.sin(time * .00013) * 5 + pointerY * -4;
      const globalRotY = 32 + time * .0045 + pointerX * 7;
      const globalRotZ = Math.sin(time * .00017) * 3;

      assembly.style.transform =
        `rotateX(${globalRotX}deg) rotateY(${globalRotY}deg) rotateZ(${globalRotZ}deg)`;

      updateCardRings(time);

      nodes.forEach((item, i) => {
        const freeze = reducedMotion ? 0 : 1;

        const dx = Math.sin(time * item.speedX + item.phaseX) * item.ampX * freeze;
        const dy = Math.sin(time * item.speedY + item.phaseY) * item.ampY * freeze;
        const dz = Math.sin(time * item.speedZ + item.phaseZ) * item.ampZ * freeze;

        const rx = Math.sin(time * item.speedY + item.phaseZ) * item.rotX * freeze;
        const ry = Math.sin(time * item.speedZ + item.phaseX) * item.rotY * freeze;
        const rz = Math.sin(time * item.speedX + item.phaseY) * item.rotZ * freeze;

        const x = item.baseX * step + dx;
        const y = item.baseY * step + dy;
        const z = item.baseZ * step + dz;

        item.node.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
        item.cube.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
      });

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
